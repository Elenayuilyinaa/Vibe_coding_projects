<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Навигатор управленческого решения — Будущее это решение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F4;
    --surface:#FFFFFF;
    --text:#1D2329;
    --text-secondary:#69737D;
    --blue:#193B5A;
    --blue-light:#6F9EB8;
    --accent-surface:#EAF1F5;
    --border:#E2E5E7;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  img,svg{max-width:100%;display:block;}

  button:focus-visible, a:focus-visible, textarea:focus-visible{
    outline:3px solid var(--blue-light);
    outline-offset:2px;
    border-radius:8px;
  }

  .app-shell{max-width:1100px;margin:0 auto;padding:0 24px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 24px;
  }
  .wordmark-small{font-weight:600;font-size:14px;color:var(--blue);letter-spacing:.02em;}
  .app-name-badge{font-size:12px;color:var(--text-secondary);font-weight:500;}

  .stage{padding:24px 24px 100px;max-width:820px;margin:0 auto;}
  .screen{animation:fadeInUp 480ms ease both;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Buttons ---------- */
  .btn{cursor:pointer;border:none;font-weight:600;border-radius:14px;transition:transform .22s ease, background .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:#132d45;transform:translateY(-1px);box-shadow:0 10px 20px rgba(25,59,90,.18);}
  .btn-lg{padding:18px 42px;font-size:17px;border-radius:16px;}
  .btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
  .btn-secondary{background:var(--accent-surface);color:var(--blue);padding:12px 22px;font-size:14px;border-radius:12px;}
  .btn-secondary:hover{background:#dfeaf1;}
  .btn-ghost{background:transparent;color:var(--text-secondary);padding:12px 18px;font-size:15px;border-radius:12px;}
  .btn-ghost:hover{color:var(--text);background:rgba(0,0,0,.03);}

  /* ---------- Start screen ---------- */
  .start-screen{text-align:center;padding-top:24px;}
  .wordmark{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;}
  .label{margin-top:8px;font-size:13px;color:var(--text-secondary);}
  .app-badge{display:inline-block;margin-top:18px;padding:7px 16px;background:var(--accent-surface);color:var(--blue);border-radius:999px;font-size:13px;font-weight:600;}
  .hero-title{margin-top:26px;font-size:54px;line-height:1.12;font-weight:600;letter-spacing:-.02em;}
  .hero-sub{margin-top:20px;font-size:18px;line-height:1.55;color:var(--text-secondary);max-width:620px;margin-left:auto;margin-right:auto;}

  .benefits-row{display:flex;gap:16px;margin-top:40px;justify-content:center;flex-wrap:wrap;}
  .benefit-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;flex:1;min-width:190px;max-width:260px;text-align:left;box-shadow:0 1px 2px rgba(29,35,41,.03);}
  .benefit-num{font-size:17px;font-weight:600;color:var(--blue);}
  .benefit-desc{margin-top:6px;font-size:14px;color:var(--text-secondary);}

  .hint-text{margin-top:22px;font-size:14px;color:var(--text-secondary);max-width:520px;margin-left:auto;margin-right:auto;}
  .start-screen .btn-lg{margin-top:40px;}

  /* ---------- Intro screen ---------- */
  .section-title-lg{font-size:32px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em;}
  .section-sub{font-size:17px;color:var(--text-secondary);line-height:1.6;max-width:640px;}
  .principles{display:flex;flex-direction:column;gap:14px;margin:32px 0 40px;}
  .principle{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 24px;}
  .principle-num{font-size:26px;font-weight:700;color:var(--blue-light);min-width:40px;}
  .principle-text{font-size:17px;}

  /* ---------- Question screen ---------- */
  .q-meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;}
  .progress-track{height:6px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:30px;}
  .progress-fill{height:100%;background:var(--blue);border-radius:999px;transition:width .5s ease;}
  .q-category{font-size:13px;font-weight:700;color:var(--blue-light);letter-spacing:.07em;text-transform:uppercase;margin-bottom:14px;}
  .q-text{font-size:27px;font-weight:600;line-height:1.38;margin-bottom:30px;letter-spacing:-.01em;}
  .options{display:flex;flex-direction:column;gap:14px;}
  .option-card{
    display:flex;gap:16px;align-items:flex-start;text-align:left;
    background:var(--surface);border:1.5px solid var(--border);border-radius:18px;
    padding:20px 22px;cursor:pointer;transition:transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
    width:100%;font-family:inherit;
  }
  .option-card:hover{transform:translateY(-2px);border-color:#c7cbce;box-shadow:0 10px 22px rgba(29,35,41,.06);}
  .option-card.selected{background:var(--accent-surface);border-color:var(--blue);}
  .option-letter{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text-secondary);transition:all .22s ease;}
  .option-card.selected .option-letter{background:var(--blue);border-color:var(--blue);color:#fff;}
  .option-text{font-size:16px;line-height:1.5;padding-top:4px;flex:1;}
  .check-indicator{flex-shrink:0;color:var(--blue);opacity:0;transition:opacity .2s;font-weight:700;padding-top:4px;}
  .option-card.selected .check-indicator{opacity:1;}

  .q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:36px;gap:12px;}

  /* ---------- Analysis screen ---------- */
  .analysis-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46vh;text-align:center;}
  .analysis-spinner{width:52px;height:52px;border-radius:50%;background:var(--accent-surface);border:2px solid var(--blue-light);animation:pulse 1.3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.65;}50%{transform:scale(1.18);opacity:1;}}
  .analysis-text{font-size:18px;color:var(--text-secondary);margin-top:26px;transition:opacity .18s ease;min-height:26px;}

  /* ---------- Result screen ---------- */
  .result-header{text-align:center;margin-bottom:8px;}
  .index-block{text-align:center;margin:36px 0 8px;}
  .index-number{font-size:78px;font-weight:700;color:var(--blue);letter-spacing:-.02em;}
  .index-max{font-size:30px;color:var(--text-secondary);font-weight:500;}
  .index-level{margin-top:10px;font-size:20px;font-weight:600;}
  .index-explain{max-width:600px;margin:16px auto 0;color:var(--text-secondary);font-size:16px;line-height:1.65;}

  .radar-wrap{display:flex;justify-content:center;margin:36px 0 8px;}
  .radar-svg{width:100%;max-width:340px;height:auto;}

  .section-title{font-size:22px;font-weight:600;margin-bottom:18px;letter-spacing:-.005em;}

  .cat-rows{margin-top:48px;}
  .cat-row{margin-bottom:24px;}
  .cat-row-head{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px;font-weight:600;}
  .cat-score{color:var(--blue);font-weight:700;}
  .bar-track{height:10px;background:var(--accent-surface);border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;width:0%;transition:width 1s cubic-bezier(.22,.9,.3,1);}
  .cat-interpretation{margin-top:7px;font-size:13px;color:var(--text-secondary);}

  .insight-card{border-radius:20px;padding:28px;margin-top:20px;}
  .insight-card.strength{background:var(--accent-surface);border:1px solid var(--blue-light);}
  .insight-card.attention{background:var(--surface);border:1px solid var(--border);}
  .insight-label{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:10px;}
  .insight-title{font-size:22px;font-weight:600;margin-bottom:10px;}
  .insight-text{font-size:16px;line-height:1.65;color:var(--text);}

  .challenge-block,.materials-block{margin-top:60px;}
  .checklist{margin-top:6px;display:flex;flex-direction:column;}
  .checklist-item{
    display:flex;gap:14px;align-items:flex-start;padding:15px 4px;border-bottom:1px solid var(--border);
    cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;
  }
  .checklist-item:first-child{border-top:1px solid var(--border);}
  .checklist-box{width:22px;height:22px;border:1.5px solid var(--border);border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s ease;color:#fff;font-size:13px;font-weight:700;margin-top:1px;}
  .checklist-item.checked .checklist-box{background:var(--blue);border-color:var(--blue);}
  .checklist-label{font-size:16px;line-height:1.5;color:var(--text);transition:color .2s ease;}
  .checklist-item.checked .checklist-label{color:var(--text-secondary);text-decoration:line-through;}

  .materials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px;}
  .material-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;}
  .material-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(29,35,41,.06);border-color:#c7cbce;}
  .material-type{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--blue-light);letter-spacing:.06em;}
  .material-title{font-size:16.5px;font-weight:600;line-height:1.35;}
  .material-desc{font-size:14px;color:var(--text-secondary);line-height:1.55;flex:1;}
  .material-meta{font-size:13px;color:var(--text-secondary);}
  .material-card .btn{align-self:flex-start;margin-top:4px;}

  .cta-block{margin-top:64px;background:var(--blue);color:#fff;border-radius:24px;padding:52px 40px;text-align:center;}
  .cta-title{font-size:27px;font-weight:600;line-height:1.3;}
  .cta-text{margin-top:14px;font-size:16px;color:rgba(255,255,255,.82);max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6;}
  .cta-buttons{margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .cta-block .btn-primary{background:#fff;color:var(--blue);}
  .cta-block .btn-primary:hover{background:#EAF1F5;}
  .cta-block .btn-ghost{color:rgba(255,255,255,.85);}
  .cta-block .btn-ghost:hover{color:#fff;background:rgba(255,255,255,.12);}

  .footer-note{text-align:center;margin-top:40px;font-size:13px;color:var(--text-secondary);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(29,35,41,.52);
    display:flex;align-items:center;justify-content:center;padding:20px;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-box{
    background:#fff;border-radius:22px;padding:32px;max-width:560px;width:100%;
    max-height:86vh;overflow-y:auto;transform:translateY(18px);transition:transform .25s ease;
    box-shadow:0 30px 60px rgba(29,35,41,.2);
  }
  .modal-overlay.open .modal-box{transform:translateY(0);}
  .map-field{margin-bottom:18px;}
  .map-field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px;}
  .map-field textarea{
    width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    font-family:inherit;font-size:15px;resize:vertical;min-height:58px;color:var(--text);
    background:var(--bg);
  }

  /* ---------- Mobile ---------- */
  @media(max-width:640px){
    .app-shell{padding:0 6px;}
    .topbar{padding:16px 14px;}
    .stage{padding:20px 14px 80px;}
    .hero-title{font-size:32px;}
    .hero-sub{font-size:16px;}
    .benefits-row{flex-direction:column;align-items:stretch;margin-top:32px;}
    .benefit-card{max-width:none;}
    .start-screen .btn-lg{width:100%;margin-top:32px;}
    .btn-lg{padding:16px 24px;}
    .section-title-lg{font-size:26px;}
    .q-text{font-size:21px;margin-bottom:24px;}
    .option-card{padding:16px 16px;}
    .q-nav .btn{padding:14px 18px;flex:1;text-align:center;justify-content:center;}
    .index-number{font-size:50px;}
    .index-max{font-size:20px;}
    .cat-rows{margin-top:36px;}
    .materials-grid{grid-template-columns:1fr;}
    .cta-block{padding:32px 22px;border-radius:20px;}
    .cta-buttons{flex-direction:column;}
    .cta-buttons .btn{width:100%;}
    .modal-box{padding:22px;border-radius:18px;}
    .insight-card{padding:22px;}
    .challenge-block,.materials-block{margin-top:44px;}
    .cta-block{margin-top:48px;}
    .topbar{flex-direction:column;align-items:flex-start;gap:4px;}
    .wordmark-small{font-size:13px;}
    .app-name-badge{font-size:11px;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="wordmark-small">Будущее — это решение</div>
    <div class="app-name-badge">Навигатор управленческого решения</div>
  </header>
  <main id="stage" class="stage screen" role="main" aria-live="polite"></main>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     ДАННЫЕ
  ========================================================= */

  var CATEGORIES = [
    {key:'q', label:'Постановка вопроса', short:'Вопрос'},
    {key:'a', label:'Альтернативы', short:'Альтернативы'},
    {key:'k', label:'Критерии выбора', short:'Критерии'},
    {key:'d', label:'Допущения', short:'Допущения'},
    {key:'n', label:'Неопределённость и риски', short:'Риски'},
    {key:'r', label:'Ретроспектива', short:'Ретро'}
  ];

  var QUESTIONS = [
    {id:1, cat:'q', catLabel:'ПОСТАНОВКА ВОПРОСА',
      text:'На совещании команда обсуждает проблему падения продаж. Как обычно начинается поиск решения?',
      options:[
        {k:'A', t:'Сразу обсуждаем конкретные действия, которые можно предпринять.', s:10},
        {k:'B', t:'Сначала пытаемся сформулировать, какое решение нам действительно предстоит принять.', s:100},
        {k:'C', t:'Смотрим, что делают конкуренты.', s:35},
        {k:'D', t:'Прошу функциональных руководителей предложить варианты.', s:65}
      ]},
    {id:2, cat:'q', catLabel:'ПОСТАНОВКА ВОПРОСА',
      text:'Появилась серьёзная проблема. Что вам ближе?',
      options:[
        {k:'A', t:'Чем быстрее выбрать решение, тем лучше.', s:10},
        {k:'B', t:'Сначала понять, является ли сформулированная проблема причиной или симптомом.', s:100},
        {k:'C', t:'Попросить эксперта предложить оптимальный вариант.', s:35},
        {k:'D', t:'Найти похожий прошлый кейс.', s:65}
      ]},
    {id:3, cat:'a', catLabel:'АЛЬТЕРНАТИВЫ',
      text:'У команды быстро появляется сильный вариант решения. Что происходит дальше?',
      options:[
        {k:'A', t:'Если большинство согласно, фиксируем решение.', s:10},
        {k:'B', t:'Намеренно ищем минимум ещё 2 альтернативы.', s:100},
        {k:'C', t:'Детально дорабатываем найденный вариант.', s:35},
        {k:'D', t:'Передаём его на согласование руководителю.', s:65}
      ]},
    {id:4, cat:'a', catLabel:'АЛЬТЕРНАТИВЫ',
      text:'Как вы относитесь к варианту «ничего пока не менять»?',
      options:[
        {k:'A', t:'Обычно это не решение.', s:10},
        {k:'B', t:'Иногда рассматриваю его как полноценную альтернативу.', s:100},
        {k:'C', t:'Только если нет ресурсов.', s:65},
        {k:'D', t:'Только если команда не договорилась.', s:35}
      ]},
    {id:5, cat:'k', catLabel:'КРИТЕРИИ',
      text:'Перед выбором между несколькими вариантами команда…',
      options:[
        {k:'A', t:'Голосует.', s:10},
        {k:'B', t:'Сравнивает плюсы и минусы каждого варианта.', s:65},
        {k:'C', t:'Заранее определяет критерии выбора и их относительную важность.', s:100},
        {k:'D', t:'Ориентируется на мнение самого опытного человека.', s:35}
      ]},
    {id:6, cat:'k', catLabel:'КРИТЕРИИ',
      text:'Два варианта выглядят примерно одинаково убедительно. Что помогает выбрать?',
      options:[
        {k:'A', t:'Интуиция руководителя.', s:10},
        {k:'B', t:'Решение, которое проще реализовать.', s:65},
        {k:'C', t:'Возвращение к целям и заранее определённым критериям.', s:100},
        {k:'D', t:'Мнение большинства.', s:35}
      ]},
    {id:7, cat:'d', catLabel:'ДОПУЩЕНИЯ',
      text:'При обсуждении стратегии как часто вы отдельно фиксируете предположения, на которых она строится?',
      options:[
        {k:'A', t:'Практически никогда.', s:10},
        {k:'B', t:'Обычно они и так понятны из обсуждения.', s:35},
        {k:'C', t:'Фиксируем ключевые предположения и определяем, какие нужно проверить.', s:100},
        {k:'D', t:'Только если решение связано с большими инвестициями.', s:65}
      ]},
    {id:8, cat:'d', catLabel:'ДОПУЩЕНИЯ',
      text:'Что происходит, если команда уверена в прогнозе рынка?',
      options:[
        {k:'A', t:'Используем прогноз как основу плана.', s:10},
        {k:'B', t:'Обсуждаем, почему именно мы считаем этот прогноз вероятным.', s:100},
        {k:'C', t:'Просим больше аналитики.', s:65},
        {k:'D', t:'Берём более консервативный прогноз.', s:35}
      ]},
    {id:9, cat:'n', catLabel:'НЕОПРЕДЕЛЁННОСТЬ И РИСКИ',
      text:'Как обычно обсуждается риск?',
      options:[
        {k:'A', t:'Составляем перечень того, что может пойти не так.', s:65},
        {k:'B', t:'Определяем несколько сценариев и оцениваем их вероятность и последствия.', s:100},
        {k:'C', t:'Закладываем финансовый резерв.', s:35},
        {k:'D', t:'Назначаем человека, отвечающего за риск.', s:10}
      ]},
    {id:10, cat:'n', catLabel:'НЕОПРЕДЕЛЁННОСТЬ И РИСКИ',
      text:'Прогноз проекта — рост продаж на 20%. Как вы предпочитаете обсуждать такую цифру?',
      options:[
        {k:'A', t:'Насколько аналитика подтверждает именно 20%.', s:65},
        {k:'B', t:'Какой диапазон результатов возможен и при каких условиях.', s:100},
        {k:'C', t:'Кто отвечает за достижение 20%.', s:10},
        {k:'D', t:'Насколько цель выше прошлогодней.', s:35}
      ]},
    {id:11, cat:'r', catLabel:'РЕТРОСПЕКТИВА',
      text:'Проект оказался очень успешным. Что происходит после завершения?',
      options:[
        {k:'A', t:'Фиксируем успешные практики.', s:65},
        {k:'B', t:'Переходим к следующей задаче.', s:10},
        {k:'C', t:'Сравниваем исходные ожидания и предположения с тем, что произошло фактически.', s:100},
        {k:'D', t:'Награждаем команду.', s:35}

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(s){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
    });
  }

  function levelLabel(score){
    if(score < 40) return 'Решения чаще строятся на скорости и интуиции';
    if(score < 60) return 'Процесс есть, но используется непоследовательно';
    if(score < 80) return 'Системный подход с отдельными зонами внимания';
    return 'Зрелая архитектура принятия решений';
  }

  function catLevel(score){
    if(score >= 80) return 'Сильная сторона';
    if(score >= 60) return 'Рабочая практика';
    if(score >= 40) return 'Зона внимания';
    return 'Возможная слепая зона';
  }

  function hexToRgb(hex){
    hex = hex.replace('#','');
    return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
  }

  function blueShade(score){
    var t = Math.max(0, Math.min(1, score/100));
    var a = hexToRgb('6F9EB8');
    var b = hexToRgb('193B5A');
    var rgb = a.map(function(v,i){ return Math.round(v + (b[i]-v)*t); });
    return 'rgb(' + rgb.join(',') + ')';
  }

  function computeResults(){
    var buckets = {};
    CATEGORIES.forEach(function(c){ buckets[c.key] = []; });
    QUESTIONS.forEach(function(q){
      var key = state.answers[q.id];
      var opt = null;
      for(var i=0;i<q.options.length;i++){ if(q.options[i].k === key){ opt = q.options[i]; break; } }
      buckets[q.cat].push(opt ? opt.s : 0);
    });
    var catAvg = {};
    CATEGORIES.forEach(function(c){
      var arr = buckets[c.key];
      var sum = arr.reduce(function(a,b){ return a+b; }, 0);
      catAvg[c.key] = Math.round(sum / arr.length);
    });
    var overallRaw = CATEGORIES.reduce(function(sum,c){ return sum + catAvg[c.key]; }, 0) / CATEGORIES.length;
    var overall = Math.round(overallRaw);
    var maxKey = CATEGORIES[0].key, minKey = CATEGORIES[0].key;
    CATEGORIES.forEach(function(c){
      if(catAvg[c.key] > catAvg[maxKey]) maxKey = c.key;
      if(catAvg[c.key] < catAvg[minKey]) minKey = c.key;
    });
    return {catAvg: catAvg, overall: overall, maxKey: maxKey, minKey: minKey};
  }

  function buildRadarSVG(catAvg){
    var size = 320, center = size/2, maxR = 108;
    var angleStep = (Math.PI*2)/6;
    var startAngle = -Math.PI/2;

    function pt(catIndex, value){
      var r = (value/100) * maxR;
      var ang = startAngle + angleStep*catIndex;
      return [center + r*Math.cos(ang), center + r*Math.sin(ang)];
    }

    var gridPolys = '';
    [20,40,60,80,100].forEach(function(level){
      var pts = CATEGORIES.map(function(c,i){ return pt(i, level).join(','); }).join(' ');
      gridPolys += '<polygon points="' + pts + '" fill="none" stroke="#E2E5E7" stroke-width="1"/>';
    });

    var axisLines = '';
    CATEGORIES.forEach(function(c,i){
      var p = pt(i, 100);
      axisLines += '<line x1="' + center + '" y1="' + center + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#E2E5E7" stroke-width="1"/>';
    });

    var dataPts = CATEGORIES.map(function(c,i){ return pt(i, catAvg[c.key]).join(','); }).join(' ');
    var dataPoly = '<polygon points="' + dataPts + '" fill="rgba(25,59,90,0.16)" stroke="#193B5A" stroke-width="2"/>';

    var dots = '';
    CATEGORIES.forEach(function(c,i){
      var p = pt(i, catAvg[c.key]);
      dots += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#193B5A"/>';
    });

    var labels = '';
    CATEGORIES.forEach(function(c,i){
      var p = pt(i, 128);
      labels += '<text x="' + p[0] + '" y="' + p[1] + '" font-size="11" font-family="Inter, sans-serif" fill="#69737D" text-anchor="middle" dominant-baseline="middle">' + escapeHtml(c.short) + '</text>';
    });

    return '<svg viewBox="0 0 ' + size + ' ' + size + '" class="radar-svg" role="img" aria-label="Радар-диаграмма профиля по шести параметрам">' + gridPolys + axisLines + dataPoly + dots + labels + '</svg>';
  }

        '<div class="insight-label">На что стоит обратить внимание</div>' +
        '<div class="insight-title">' + minMeta.label + '</div>' +
        '<div class="insight-text">' + ATTENTION[r.minKey] + '</div>' +
      '</div>' +
      '<div class="challenge-block">' +
        '<h3 class="section-title">Попробуйте на следующем важном решении</h3>' +
        '<div class="checklist">' + checklistItems + '</div>' +
      '</div>' +
      '<div class="materials-block">' +
        '<h3 class="section-title">Рекомендованные материалы библиотеки</h3>' +
        '<div class="materials-grid">' + materialCards + '</div>' +
      '</div>' +
      '<div class="cta-block">' +
        '<div class="cta-title">Решение становится сильнее, когда его можно увидеть целиком</div>' +
        '<p class="cta-text">Используйте «Карту управленческого решения», чтобы применить результаты диагностики к реальной задаче вашей команды.</p>' +
        '<div class="cta-buttons">' +
          '<button type="button" class="btn btn-primary" data-action="open-map">Открыть Карту решения</button>' +
          '<button type="button" class="btn btn-ghost" data-action="restart">Пройти диагностику заново</button>' +
        '</div>' +
      '</div>' +
      '<p class="footer-note">Навигатор управленческого решения — часть библиотеки «Будущее — это решение»</p>'
    );
  }

  /* =========================================================
     ОСНОВНОЙ РЕНДЕР
  ========================================================= */

  function render(){
    var stage = document.getElementById('stage');
    var html = '';
    if(state.screen === 'start') html = renderStart();
    else if(state.screen === 'intro') html = renderIntro();
    else if(state.screen === 'question') html = renderQuestion();
    else if(state.screen === 'analysis') html = renderAnalysis();
    else if(state.screen === 'result') html = renderResult();

    stage.innerHTML = html;
    stage.classList.remove('screen');
    void stage.offsetWidth;
    stage.classList.add('screen');
    window.scrollTo(0,0);
  }

  function renderModal(){
    var root = document.getElementById('modalRoot');
    if(!state.modal){
      root.innerHTML = '<div class="modal-overlay"></div>';
      return;
    }
    var inner = '';
    if(state.modal.type === 'material'){
      var m = state.modal.data;
      inner = (
        '<div class="modal-box" role="dialog" aria-modal="true" aria-label="' + escapeHtml(m.title) + '">' +
          '<div class="material-type">' + m.type + '</div>' +
          '<h3 class="insight-title" style="margin-top:8px;">' + escapeHtml(m.title) + '</h3>' +
          '<p class="insight-text">' + escapeHtml(m.desc) + '</p>' +
          '<p class="hint-text" style="margin:18px 0 0;text-align:left;max-width:none;">Материал входит в библиотеку «Будущее — это решение». В полной версии здесь будет открываться статья или инструмент.</p>' +
          '<button type="button" class="btn btn-primary" data-close style="margin-top:20px;width:100%;">Закрыть</button>' +
        '</div>'
      );
    } else if(state.modal.type === 'map'){
      var fields = MAP_FIELDS.map(function(f){
        var val = escapeHtml(state.mapAnswers[f.key] || '');
        return (
          '<div class="map-field">' +
            '<label for="map-' + f.key + '">' + f.label + '</label>' +
            '<textarea id="map-' + f.key + '" data-map-field="' + f.key + '" rows="2">' + val + '</textarea>' +
          '</div>'
        );
      }).join('');
      inner = (
        '<div class="modal-box" role="dialog" aria-modal="true" aria-label="Карта управленческого решения">' +
          '<h3 class="insight-title">Карта управленческого решения</h3>' +
          '<p class="hint-text" style="margin:8px 0 22px;text-align:left;max-width:none;">Заполните карту на основе результатов диагностики — для реальной задачи вашей команды.</p>' +
          fields +
          '<button type="button" class="btn btn-primary" data-close style="width:100%;margin-top:6px;">Готово</button>' +
        '</div>'
      );
    }
    root.innerHTML = '<div class="modal-overlay open">' + inner + '</div>';
  }

  /* =========================================================
     АНИМАЦИИ РЕЗУЛЬТАТА
  ========================================================= */

  function startResultAnimations(){
    var target = state.results.overall;
    var el = document.getElementById('indexNumber');
    if(el){
      var duration = 900;
      var startTime = null;
      function step(ts){
        if(startTime === null) startTime = ts;
        var p = Math.min(1, (ts - startTime) / duration);
        el.textContent = Math.round(target * p);
        if(p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    var bars = document.querySelectorAll('.bar-fill');
    bars.forEach(function(bar, i){
      setTimeout(function(){
        bar.style.width = bar.getAttribute('data-target') + '%';
      }, 250 + i*130);
    });
  }

  /* =========================================================
     НАВИГАЦИЯ
  ========================================================= */

  function goStart(){ state.screen = 'start'; render(); }
  function goIntro(){ state.screen = 'intro'; render(); }
  function goQuestion(idx){ state.screen = 'question'; state.qIndex = idx; render(); }

  function prevQuestion(){
    if(state.qIndex > 0){ goQuestion(state.qIndex - 1); }
    else { goIntro(); }
  }

  function nextQuestion(){
    if(state.qIndex < 11){ goQuestion(state.qIndex + 1); }
    else { runAnalysis(); }
  }

  function runAnalysis(){
    state.screen = 'analysis';
    render();
    var lines = [
      'Собираем профиль решения…',
      'Сравниваем этапы процесса…',
      'Определяем сильные стороны и зоны внимания…'
    ];
    var i = 0;
    var el = document.getElementById('analysisText');
    var timer = setInterval(function(){
      i++;
      if(i < lines.length && el){
        el.style.opacity = 0;
        setTimeout(function(){
          if(el){ el.textContent = lines[i]; el.style.opacity = 1; }
        }, 160);
      }
    }, 500);
    setTimeout(function(){
      clearInterval(timer);
      state.results = computeResults();
      state.screen = 'result';
      render();
      requestAnimationFrame(startResultAnimations);
    }, 1650);
  }

  function restart(){
    state.answers = {};
    state.checklist = {};
    state.mapAnswers = {};
    state.results = null;
    state.qIndex = 0;
    state.modal = null;
    state.screen = 'start';
    renderModal();
    render();
  }

  function openMaterial(catKey, idx){
    state.modal = {type:'material', data: MATERIALS[catKey][idx]};
    renderModal();
  }

  function openMap(){
    state.modal = {type:'map'};
    renderModal();
  }

  function closeModal(){
    state.modal = null;
    renderModal();
  }

  function handleSelectOption(card){
    var qid = parseInt(card.getAttribute('data-qid'), 10);
    var key = card.getAttribute('data-key');
    state.answers[qid] = key;
    var group = card.parentElement;
    var cards = group.querySelectorAll('.option-card');
    cards.forEach(function(c){ c.classList.remove('selected'); c.setAttribute('aria-pressed','false'); });
    card.classList.add('selected');
    card.setAttribute('aria-pressed','true');
    var nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.disabled = false;
  }

  function toggleChecklist(idx, el){
    state.checklist[idx] = !state.checklist[idx];
    var checked = !!state.checklist[idx];
    el.classList.toggle('checked', checked);
    el.setAttribute('aria-pressed', checked ? 'true' : 'false');
    var box = el.querySelector('.checklist-box');
    if(box) box.textContent = checked ? '✓' : '';
  }

  /* =========================================================
     ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
  ========================================================= */

  document.addEventListener('click', function(e){
    var overlay = e.target.closest ? e.target.closest('.modal-overlay') : null;
    if(overlay && e.target === overlay){ closeModal(); return; }

    var closeEl = e.target.closest ? e.target.closest('[data-close]') : null;
    if(closeEl){ closeModal(); return; }

    var optCard = e.target.closest ? e.target.closest('.option-card') : null;
    if(optCard){ handleSelectOption(optCard); return; }

    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if(!el) return;
    var action = el.getAttribute('data-action');

    switch(action){
      case 'go-start': goStart(); break;
      case 'go-intro': goIntro(); break;
      case 'go-questions': goQuestion(0); break;
      case 'prev-question': prevQuestion(); break;
      case 'next-question': nextQuestion(); break;
      case 'open-material': openMaterial(el.getAttribute('data-cat'), parseInt(el.getAttribute('data-idx'),10)); break;
      case 'open-map': openMap(); break;
      case 'toggle-checklist': toggleChecklist(parseInt(el.getAttribute('data-idx'),10), el); break;
      case 'restart': restart(); break;
    }
  });

  document.addEventListener('input', function(e){
    if(e.target && e.target.matches && e.target.matches('[data-map-field]')){
      state.mapAnswers[e.target.getAttribute('data-map-field')] = e.target.value;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && state.modal){ closeModal(); }
  });

  /* =========================================================
     СТАРТ
  ========================================================= */

  renderModal();
  render();

})();
</script>
</body>
</html>
